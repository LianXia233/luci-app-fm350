name: cargo-test

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  # A: 沙箱视角的基础验证（无 setup action，用镜像预装 stable）
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install libudev (serialport)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: cargo test
        run: |
          set -o pipefail
          rustc --version && cargo --version
          cargo test 2>&1 | tee test.log
          grep -E 'test result:' test.log || { echo "::error::no test result lines"; exit 1; }

  # B: 逐字复刻仓库 CI 的 rust-tests（setup-rust-toolchain + cache + --locked）
  their-exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - name: 安装 serialport 的系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev
      - name: 单元测试（逐字复刻）
        id: t
        run: |
          rustc --version && cargo --version
          set +e
          cargo test --locked --manifest-path rust/Cargo.toml > /tmp/their.log 2>&1
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          tail -40 /tmp/their.log
          grep -E 'test result:' /tmp/their.log
      - name: publish their-exact report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "rc_line=$(grep '^rc=' <<< x || true)"
            echo "steps.t.rc=${{ steps.t.outputs.rc }}"
            echo "rustc: $(rustc --version 2>/dev/null)"
            echo "cargo: $(cargo --version 2>/dev/null)"
            echo "---- cargo test --locked output ----"
            cat /tmp/their.log 2>/dev/null | tail -120
          } > /tmp/report.txt
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          text = pathlib.Path('/tmp/report.txt').read_text(errors='replace')[:60000]
          payload = {
              "name": "their-exact-report",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": "neutral",
              "output": {"title": "their-exact cargo test --locked report", "summary": text},
          }
          req = urllib.request.Request(
              "https://api.github.com/repos/%s/check-runs" % os.environ["GITHUB_REPOSITORY"],
              data=json.dumps(payload).encode(),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer %s" % os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req) as r:
                  print("check-run created:", r.status)
          except Exception as e:
              print("check-run create failed:", e)
          PY
